<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Track what you're reading, your TBR pile, spice, tropes and reading stats.">
  <title>Shelflife</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="app">
    <nav class="rail" id="nav" aria-label="Main"></nav>
    <div class="main-col">
      <header class="topbar">
        <a href="#/" class="wordmark" aria-label="Shelflife home">SHELF<span>L</span>IFE</a>
        <div class="topbar-actions">
          <a href="#/add" class="btn btn-light btn-sm hide-narrow">Add a book <span class="btn-ico">↗</span></a>
          <a href="#/settings" class="icon-btn" aria-label="Settings" id="settings-link"></a>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
